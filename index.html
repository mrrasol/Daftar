<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e57">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>دفتر | مدیریت کلاس</title>
<style>
:root{
  --ink:#14302e;--muted:#5f7472;--bg:#f2f6f5;--panel:#fff;--line:#e1eae8;
  --primary:#0f5e57;--primary-soft:#dcefec;--accent:#e9a23b;--danger:#c2410c;
  --radius:14px
}
@media(prefers-color-scheme:dark){
  :root{--ink:#e6f1ef;--muted:#93aaa7;--bg:#0e1a19;--panel:#162725;--line:#24403c;--primary:#2fa398;--primary-soft:#1d3a37;--accent:#f0b24f;--danger:#f08a5d}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;height:100%}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;font-weight:700;flex:1}
header small{display:block;font-size:12.5px;font-weight:400;opacity:.8;line-height:1.4}
.back{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:14px 14px 150px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--primary-soft)}
.badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:13px;color:var(--muted)}
.icon{background:none;border:0;color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:10px;cursor:pointer;flex:none}
.icon:active{background:var(--line)}
.icon.del{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:40px 18px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.bar{display:flex;gap:8px;margin:0 0 12px}
.chip{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--primary);font:inherit;font-weight:600;padding:9px 8px;border-radius:12px;cursor:pointer}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--accent);color:#2a1c00;border:0;border-radius:18px;min-height:54px;padding:0 18px;font:inherit;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;z-index:7}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,23,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
textarea{min-height:140px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;font:inherit;font-weight:700;border-radius:12px;padding:11px;border:0;cursor:pointer}
.btn.ok{background:var(--primary);color:#fff}
.btn.no{background:var(--line);color:var(--ink)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:4px;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:6}
.nv{flex:1;background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:9px 3px;border-radius:12px;cursor:pointer}
.nv.on{color:var(--primary);background:var(--primary-soft)}
.grid{display:grid;gap:5px}
.dh,.ph{text-align:center;font-size:11px;font-weight:700;color:var(--muted);align-self:center}
.dh{padding:6px 0;border-radius:10px}.dh.today{background:var(--accent);color:#2a1c00}
.cell{min-height:68px;border:0;border-radius:11px;color:#fff;font:inherit;padding:5px 3px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;overflow:hidden;min-width:0}
.cell b{font-size:11px;line-height:1.3}.cell span{font-size:10px;opacity:.85;line-height:1.2}
.cell.empty{background:var(--panel);color:var(--muted);border:1.5px dashed var(--line);font-size:20px}
.paper{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;line-height:2;margin-bottom:12px}
@media print{header,nav,.fab,.noprint,#modal{display:none!important}body{background:#fff;color:#000}.paper{border:0;padding:0}main{padding:0}}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:7px 13px;border-radius:20px;cursor:pointer}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:flex;gap:4px;flex:none}
.sg{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:6px 8px;border-radius:9px;cursor:pointer;white-space:nowrap}
.sg.on{color:#fff;border-color:transparent}.sg.on.s-a{background:#c2410c}.sg.on.s-l{background:#b7791f}.sg.on.s-e{background:#1d6fb8}
.pm{width:40px;height:40px;border-radius:11px;border:0;font:inherit;font-size:22px;font-weight:700;cursor:pointer;color:#fff;flex:none}
.pm.plus{background:#2f855a}.pm.minus{background:#c2410c}
.sc{width:88px;text-align:center;font-weight:700}
input[type=date]{max-width:220px}
.jdate-wrap{display:flex;align-items:center;gap:7px;width:100%}.jdate-wrap>[data-jdate]{flex:1;min-width:0}.jdate-wrap .jdate-picker{width:54px;max-width:54px;height:48px;padding:5px;flex:none;cursor:pointer}.sheet .jdate-wrap{margin:3px 0 8px}
.warn{background:#fff4df;border:1px solid #e9a23b;color:#634008;padding:12px;border-radius:12px;margin:0 0 12px}
@media(prefers-color-scheme:dark){.warn{background:#3b301c;border-color:#8a6b31;color:#ffe1a3}}
.session{margin-bottom:10px}
.session .chip{font-size:13px}
@media(max-width:370px){.row{gap:6px;padding:9px 8px}.sg{padding:6px 6px;font-size:11px}.badge{width:36px;height:36px}}

.sheet{display:flex;flex-direction:column;overflow:hidden;padding:18px 16px 0}
.sheet h2{flex:none}
.sheet .sheet-fields{overflow:auto;min-height:0;padding-bottom:8px}
.sheet .actions{position:sticky;bottom:0;background:var(--panel);padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 12px);margin-top:4px;flex:none}
.sheet textarea{min-height:110px}
.sheet input,.sheet textarea{scroll-margin-bottom:120px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.toolbar .chip{flex:1;min-width:110px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.statbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.statbox b{display:block;font-size:20px;color:var(--primary)}
.statbox span{font-size:12px;color:var(--muted)}
.notearea{min-height:100px}
.modebar{display:flex;gap:8px;margin-bottom:10px}
.modebar .chip.active{background:var(--primary);color:white}
.smallmuted{font-size:12px;color:var(--muted)}
.dash-date{font-weight:700;color:var(--primary);font-size:15px;margin:0 2px 14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}.section-head h3{margin:0}.small-edit{flex:none!important;min-width:0!important;padding:5px 10px;font-size:12px}



.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}
.chart-card>b{display:block;font-size:14px;margin-bottom:10px}
.chart-bars{display:grid;gap:10px}
.chart-row{display:grid;grid-template-columns:minmax(74px,1fr) minmax(70px,2fr) auto;align-items:center;gap:8px;font-size:12px}
.chart-row>span{overflow-wrap:anywhere;color:var(--muted)}
.chart-row>strong{font-size:12px;min-width:42px;text-align:left}
.chart-track{height:10px;background:var(--bg);border-radius:20px;overflow:hidden}
.chart-track i{display:block;height:100%;background:var(--primary);border-radius:20px}
.chart-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chart-kpis>div{background:var(--bg);border-radius:10px;padding:9px;text-align:center}
.chart-kpis strong{display:block;font-size:18px;color:var(--primary)}
.chart-kpis span{font-size:11px;color:var(--muted)}
.report-subtitle{font-size:16px;margin:18px 2px 8px}
.checkline{display:flex;align-items:center;gap:8px;margin:9px 0;color:var(--ink)}
.checkline input{width:19px;height:19px;flex:none}
@media print{.chart-card{break-inside:avoid;border:1px solid #bbb}.chart-track{border:1px solid #aaa}.chart-track i{background:#555!important}}


.v5-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.v5-tool{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:right;color:var(--ink);font:inherit;cursor:pointer}
.v5-tool b{display:block;color:var(--primary);font-size:14px}.v5-tool span{font-size:11px;color:var(--muted)}
.searchbar{display:flex;gap:7px;margin:0 0 12px}.searchbar input{flex:1}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--line);cursor:pointer}
.timeline{border-right:2px solid var(--line);margin:12px 8px;padding-right:14px}.timeline-item{position:relative;padding:0 0 13px}.timeline-item:before{content:"";position:absolute;right:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.pill{display:inline-block;border-radius:20px;background:var(--primary-soft);color:var(--primary);padding:2px 8px;font-size:11px}

/* Daftar 5.1: compact dashboard, accessible navigation and startup state */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
#boot .boot-card{width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
#boot .boot-mark{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:27px}
#boot .boot-track{height:4px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
#boot .boot-track i{display:block;height:100%;width:42%;background:var(--primary);border-radius:8px;animation:bootmove 1.1s ease-in-out infinite alternate}
@keyframes bootmove{from{transform:translateX(0)}to{transform:translateX(135%)}}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:5px 2px;font-size:11px;line-height:1.25}
.nv svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quick-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 12px}
.quick-btn{min-width:0;min-height:68px;padding:8px 3px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.quick-btn svg{width:22px;height:22px;stroke:var(--primary);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.quick-btn span{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.schedule-grid{gap:3px!important;margin-bottom:14px}
.schedule-grid .cell{min-height:47px;padding:3px 2px;border-radius:8px;gap:1px}
.schedule-grid .cell b{font-size:10px;line-height:1.2}
.schedule-grid .cell span{font-size:9px;line-height:1.15}
.schedule-grid .dh{padding:2px 0;font-size:10px}
.schedule-grid .ph{font-size:10px}
.schedule-grid .cell.empty{font-size:16px}
.student-link{display:inline;border:0;background:none;padding:0;color:var(--primary);font:inherit;font-weight:650;text-align:right;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;cursor:pointer}
.student-link:active,.student-link:focus-visible{text-decoration-color:currentColor}
.directory-filter{margin:0 0 10px}
.directory-filter input{background:var(--panel)}
.period-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:10px 0}
.period-table{min-width:620px;width:100%;border-collapse:collapse;font-size:12px}
.period-table th,.period-table td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.period-table th:first-child,.period-table td:first-child{text-align:right;position:sticky;right:0;background:var(--panel);z-index:1;min-width:120px}
.period-table input{width:58px;padding:5px;text-align:center;font-size:12px}
.period-table tr:last-child td{border-bottom:0}
.period-actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
@media(max-width:370px){.quick-btn{min-height:62px}.quick-btn span{font-size:10px}.schedule-grid .cell{min-height:43px}}
</style>
</head>
<body>
<header>
  <button class="back" id="back" aria-label="بازگشت" hidden>→</button>
  <h1 id="title">دفتر</h1>
</header>
<div id="boot" aria-live="polite"><div class="boot-card"><div class="boot-mark">📘</div><b>دفتر</b><div class="hint">در حال آماده‌سازی اطلاعات و محیط برنامه…</div><div class="boot-track"><i></i></div></div></div>
<main id="app"></main>
<nav id="nav"></nav>
<button class="fab" id="fab"></button>
<div id="modal"></div>

<script>
'use strict';

const KEY = 'classapp-v1';
const APP_NAME = 'Daftar';
const FORMAT_VERSION = 6; // V5 backups remain importable; format 6 adds weighted assessment periods
const MAX_BACKUP_BYTES = 20 * 1024 * 1024;
const COLORS = ['#0f5e57','#7c4dbd','#c2570c','#1d6fb8','#b0316b','#5b7a1f'];
const DAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const NAV = [['plan','میز کار','<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>'],['schools','مدارس','<svg viewBox="0 0 24 24"><path d="m3 9 9-6 9 6"/><path d="M5 10v10h14V10M9 20v-6h6v6M3 20h18"/></svg>'],['report','گزارش‌ها','<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 6-7"/><path d="M16 6h4v4"/></svg>'],['set','تنظیمات','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 2.9-.2-.1a1.7 1.7 0 0 0-1.8.1l-.2.1h-3.4l-.1-.2a1.7 1.7 0 0 0-1.5-1l-.2-.1-2.9-1.7.1-.2a1.7 1.7 0 0 0-.1-1.8l-.1-.2v-3.4l.2-.1a1.7 1.7 0 0 0 1-1.5l.1-.2 1.7-2.9.2.1a1.7 1.7 0 0 0 1.8-.1l.2-.1h3.4l.1.2a1.7 1.7 0 0 0 1.5 1l.2.1 2.9 1.7-.1.2a1.7 1.7 0 0 0 .1 1.8l.1.2z" transform="translate(-1 -1)"/></svg>']];
const TG = [['list','دانش‌آموزان'],['courses','درس‌ها']];
const TC = [['att','حضور و غیاب'],['pts','مثبت و منفی'],['exam','ارزشیابی'],['hw','تکالیف']];
const ST = {a:'غایب',l:'تأخیر',e:'موجه'};
const ARRAY_KEYS = ['schools','classes','students','attendance','points','exams','courses','assignments','checklists','evaluations','groups','teachingLogs','assessmentPeriods'];

let loadWarning = '';
let db = load();
let v = {nav:'plan',editPlan:false};
let routeStateReady=false,lastRouteKey='',suppressRouteHistory=false,modalHistoryOpen=false,lastRootBack=0;
function routeKey(){const x={};['nav','page','schoolId','classId','courseId','tab','tool','toolClassId','profileId','assignmentId','examId','periodId','evaluationId','rep'].forEach(k=>{if(v[k]!==undefined)x[k]=v[k];});return JSON.stringify(x);}
function syncRouteHistory(){
  const key=routeKey();
  if(!routeStateReady){history.replaceState({daftarRoute:clone(v)},'');routeStateReady=true;lastRouteKey=key;return;}
  if(suppressRouteHistory){suppressRouteHistory=false;lastRouteKey=key;return;}
  if(key!==lastRouteKey){history.pushState({daftarRoute:clone(v)},'');lastRouteKey=key;}
}
function pushModalHistory(){if(!modalHistoryOpen){history.pushState({daftarModal:true,daftarRoute:clone(v)},'');modalHistoryOpen=true;}}
function shortcutDefaults(){return ['students','assignments','groups'];}
function shortcutList(){return Array.isArray(db.settings.shortcuts)&&db.settings.shortcuts.length===3?db.settings.shortcuts:shortcutDefaults();}
function iconSvg(name){const icons={students:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/></svg>',assignments:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',groups:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 15a5 5 0 0 1 5 5"/></svg>',logs:'<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg>',checklists:'<svg viewBox="0 0 24 24"><path d="m4 7 2 2 4-4M12 7h8M4 15l2 2 4-4M12 15h8"/></svg>',add:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>'};return icons[name]||icons.add;}
const SHORTCUT_LABELS={students:'دانش‌آموزان',assignments:'تکالیف',groups:'گروه‌ها',logs:'ثبت تدریس',checklists:'چک‌لیست',add:'افزودن'};


function empty(){
  return {
    schools:[],classes:[],students:[],attendance:[],points:[],exams:[],courses:[],assignments:[],
    checklists:[],evaluations:[],groups:[],teachingLogs:[],assessmentPeriods:[],
    schedule:{},settings:{hidden:[5,6],teacher:'',school:'',transpose:false},v2:1,v3:1
  };
}
function isObject(x){return !!x && typeof x === 'object' && !Array.isArray(x);}
function clone(x){return JSON.parse(JSON.stringify(x));}
function idSet(items){return new Set(items.map(x=>String(x.id)));}
function hasUniqueIds(items){
  const seen=new Set();
  return items.every(x=>{
    if(!isObject(x)||x.id==null||String(x.id).trim()==='')return false;
    const id=String(x.id);
    if(seen.has(id))return false;
    seen.add(id);return true;
  });
}
function load(){
  let raw;
  try{raw=localStorage.getItem(KEY);}catch(e){loadWarning='مرورگر اجازه دسترسی به حافظه محلی را نمی‌دهد.';return empty();}
  if(raw==null)return empty();
  try{
    const parsed=JSON.parse(raw);
    if(!isObject(parsed))throw new Error('ساختار اصلی داده معتبر نیست.');
    const d=empty();
    for(const k of ARRAY_KEYS){
      if(parsed[k]!==undefined&&!Array.isArray(parsed[k]))throw new Error('ساختار بخش «'+k+'» معتبر نیست.');
      if(Array.isArray(parsed[k]))d[k]=parsed[k];
    }
    if(parsed.schedule!==undefined&&!isObject(parsed.schedule))throw new Error('ساختار برنامه هفتگی معتبر نیست.');
    if(isObject(parsed.schedule))d.schedule=parsed.schedule;
    if(parsed.settings!==undefined&&!isObject(parsed.settings))throw new Error('ساختار تنظیمات معتبر نیست.');
    if(isObject(parsed.settings))d.settings=Object.assign(d.settings,parsed.settings);
    if(!Array.isArray(d.settings.hidden))d.settings.hidden=[5,6];
    d.settings.hidden=d.settings.hidden.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6);
    d.settings.teacher=String(d.settings.teacher||'');
    d.settings.school=String(d.settings.school||'');
    d.settings.transpose=!!d.settings.transpose;
    if(!Array.isArray(d.settings.shortcuts)||d.settings.shortcuts.length!==3)d.settings.shortcuts=shortcutDefaults();
    d.v2=parsed.v2||0;d.v3=parsed.v3||0;
    const result=validateData(d,{allowLegacy:!d.v2});
    if(!result.ok)throw new Error(result.message);
    return d;
  }catch(e){
    loadWarning='اطلاعات ذخیره‌شده قابل خواندن یا ناسازگار است. برای جلوگیری از بازنویسی داده‌ها، برنامه در حالت محافظت‌شده باز شده است. جزئیات: '+(e.message||'خطای نامشخص');
    return empty();
  }
}

function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);let jd=1+(days<186?days%31:(days-186)%30);return [jy,jm,jd];}
function j2g(jy,jm,jd){jy=Number(jy);jm=Number(jm);jd=Number(jd);jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++;}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365;}let gd=days+1;const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=1;while(gm<=12&&gd>sal[gm]){gd-=sal[gm];gm++;}return [gy,gm,gd];}
const isoDate=(y,m,d)=>String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
function jalaliInput(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number),j=g2j(y,m,d);return j.map(x=>String(x).padStart(2,'0')).join('/');}
function parseJalali(value){const norm=String(value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/-/g,'/').trim();const a=norm.split('/').map(Number);if(a.length!==3||!a.every(Number.isInteger)||a[0]<1200||a[0]>1600||a[1]<1||a[1]>12||a[2]<1||a[2]>(a[1]<=6?31:a[1]<=11?30:30))return null;const [gy,gm,gd]=j2g(a[0],a[1],a[2]);const iso=isoDate(gy,gm,gd);const back=g2j(gy,gm,gd);return back[0]===a[0]&&back[1]===a[1]&&back[2]===a[2]?iso:null;}
const dateField=(id,iso)=>`<div class="jdate-wrap"><input type="text" inputmode="numeric" id="${id}" data-jdate value="${esc(jalaliInput(iso))}" placeholder="۱۴۰۵/۰۸/۰۸"><input type="date" class="jdate-picker" aria-label="انتخاب تاریخ از تقویم" value="${esc(iso||today())}" data-for="${id}"></div>`;

function validateData(d,opts={}){
  const legacy=!!opts.allowLegacy;
  for(const k of ARRAY_KEYS)if(!Array.isArray(d[k]))return {ok:false,message:'بخش '+k+' باید آرایه باشد.'};
  if(!isObject(d.schedule)||!isObject(d.settings))return {ok:false,message:'برنامه هفتگی یا تنظیمات معتبر نیست.'};
  if(!hasUniqueIds(d.schools)||!hasUniqueIds(d.classes)||!hasUniqueIds(d.students)||!hasUniqueIds(d.courses)||!hasUniqueIds(d.attendance)||!hasUniqueIds(d.points)||!hasUniqueIds(d.exams)||!hasUniqueIds(d.assignments||[])){
    return {ok:false,message:'شناسه تکراری یا شناسه خالی در اطلاعات وجود دارد.'};
  }
  const schools=idSet(d.schools),classes=idSet(d.classes),students=idSet(d.students),courses=idSet(d.courses);
  for(const s of d.schools)if(typeof s.name!=='string'||!s.name.trim())return {ok:false,message:'نام یکی از مدرسه‌ها معتبر نیست.'};
  for(const c of d.classes)if(!schools.has(String(c.schoolId))||typeof c.name!=='string'||!c.name.trim())return {ok:false,message:'ارتباط یکی از کلاس‌ها با مدرسه معتبر نیست.'};
  const classOfStudent=new Map();
  for(const s of d.students){
    if(!classes.has(String(s.classId))||typeof s.name!=='string'||!s.name.trim())return {ok:false,message:'ارتباط یا نام یکی از دانش‌آموزان معتبر نیست.'};
    classOfStudent.set(String(s.id),String(s.classId));
  }
  for(const c of d.courses)if(!classes.has(String(c.classId))||typeof c.name!=='string'||!c.name.trim())return {ok:false,message:'ارتباط یکی از درس‌ها با کلاس معتبر نیست.'};
  const courseClass=new Map(d.courses.map(c=>[String(c.id),String(c.classId)]));
  const legacyClassRef=legacy&&d.courses.length===0;
  const getClassForRef=ref=>legacyClassRef?(classes.has(String(ref))?String(ref):null):(courseClass.get(String(ref))||null);
  for(const a of d.attendance){
    const cl=getClassForRef(a.classId);
    if(!cl||typeof a.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||!isObject(a.marks))return {ok:false,message:'یکی از جلسات حضور و غیاب ساختار نامعتبر دارد.'};
    for(const [sid,status] of Object.entries(a.marks)){
      if(classOfStudent.get(String(sid))!==cl||!['a','l','e'].includes(status))return {ok:false,message:'علامت حضور و غیاب به دانش‌آموز یا کلاس نامعتبر اشاره می‌کند.'};
    }
  }
  for(const p of d.points){
    const cl=getClassForRef(p.classId);
    if(!cl||classOfStudent.get(String(p.studentId))!==cl||![1,-1].includes(Number(p.val)))return {ok:false,message:'یکی از سوابق مثبت و منفی با دانش‌آموز یا درس هماهنگ نیست.'};
  }
  for(const e of d.exams){
    const cl=getClassForRef(e.classId),max=Number(e.max);
    if(!cl||typeof e.title!=='string'||!e.title.trim()||!Number.isFinite(max)||max<=0||!isObject(e.scores))return {ok:false,message:'ساختار یکی از آزمون‌ها معتبر نیست.'};
    for(const [sid,score] of Object.entries(e.scores)){
      const n=Number(score);
      if(classOfStudent.get(String(sid))!==cl||!Number.isFinite(n)||n<0||n>max)return {ok:false,message:'نمره‌ای خارج از محدوده یا متعلق به دانش‌آموز نامرتبط وجود دارد.'};
    }
  }
  for(const a of (d.assignments||[])){
    if(!isObject(a)||a.id==null||!courseClass.has(String(a.courseId))||typeof a.title!=='string'||!a.title.trim()||!Number.isFinite(Number(a.maxScore))||Number(a.maxScore)<=0||String(a.dueDate||'').split('-').length!==3||!isObject(a.records))return {ok:false,message:'ساختار یکی از تکالیف معتبر نیست.'};
    const cl=courseClass.get(String(a.courseId));
    for(const [sid,r] of Object.entries(a.records||{}))if(classOfStudent.get(String(sid))!==cl||!isObject(r)||(r.score!=null&&(!Number.isFinite(Number(r.score))||Number(r.score)<0||Number(r.score)>Number(a.maxScore)))||!['submitted','incomplete','missing'].includes(r.status||'submitted'))return {ok:false,message:'سوابق یکی از تکالیف معتبر نیست.'};
  }
  if(!hasUniqueIds(d.assessmentPeriods||[]))return {ok:false,message:'شناسه تکراری یا خالی در دوره‌های ارزشیابی وجود دارد.'};
  for(const p of (d.assessmentPeriods||[])){
    if(!isObject(p)||p.id==null||!courseClass.has(String(p.courseId))||typeof p.title!=='string'||!p.title.trim()||!Array.isArray(p.methods)||!isObject(p.records||{}))return {ok:false,message:'ساختار یکی از دوره‌های ارزشیابی معتبر نیست.'};
    const sum=p.methods.reduce((a,m)=>a+Number(m.weight||0),0);if(!p.methods.length||Math.abs(sum-100)>0.001||p.methods.some(m=>!m.id||!m.title||!Number.isFinite(Number(m.weight))||Number(m.weight)<=0||!Number.isFinite(Number(m.maxScore))||Number(m.maxScore)<=0))return {ok:false,message:'روش‌ها یا وزن‌های یک دوره ارزشیابی معتبر نیستند.'};
    for(const [sid,rec] of Object.entries(p.records||{})){if(!classOfStudent.has(String(sid))||classOfStudent.get(String(sid))!==courseClass.get(String(p.courseId))||!isObject(rec))return {ok:false,message:'سوابق یک دوره ارزشیابی به دانش‌آموز نامرتبط اشاره می‌کند.'};for(const [mid,score] of Object.entries(rec)){const method=p.methods.find(m=>String(m.id)===String(mid)),n=Number(score);if(!method||!Number.isFinite(n)||n<0||n>Number(method.maxScore))return {ok:false,message:'نمره‌ای در دوره ارزشیابی خارج از محدوده ثبت شده است.'};}}
  }
  for(const ref of Object.values(d.schedule)){
    if(typeof ref!=='string'&&typeof ref!=='number')return {ok:false,message:'شناسه یکی از زنگ‌های برنامه هفتگی معتبر نیست.'};
    if(legacyClassRef?!classes.has(String(ref)):!courses.has(String(ref)))return {ok:false,message:'برنامه هفتگی به درس یا کلاس ناموجود اشاره می‌کند.'};
  }
  return {ok:true};
}

function migrate(persist=true){
  if(loadWarning||db.v3)return false;
  if(db.v2){db.v3=1;clean();if(persist)save();return true;}
  const map={};
  db.classes.forEach(c=>{
    let co=db.courses.find(x=>String(x.classId)===String(c.id));
    if(!co){
      co={id:uid(),classId:c.id,name:String(c.subject||c.name||'درس جدید')};
      db.courses.push(co);
    }
    map[String(c.id)]=co.id;
  });
  ['attendance','exams','points'].forEach(key=>{
    db[key].forEach(item=>{
      if(map[String(item.classId)])item.classId=map[String(item.classId)];
    });
  });
  Object.keys(db.schedule).forEach(key=>{
    if(map[String(db.schedule[key])])db.schedule[key]=map[String(db.schedule[key])];
  });
  db.v2=1;
  db.v3=1;
  clean();
  if(persist)save();
  return true;
}

function clean(){
  const schoolIds=idSet(db.schools);
  db.classes=db.classes.filter(c=>schoolIds.has(String(c.schoolId)));
  const classIds=idSet(db.classes);
  db.students=db.students.filter(s=>classIds.has(String(s.classId)));
  const studentIds=idSet(db.students);
  db.courses=db.courses.filter(c=>classIds.has(String(c.classId)));
  const courseMap=new Map(db.courses.map(c=>[String(c.id),String(c.classId)]));
  db.points=db.points.filter(p=>studentIds.has(String(p.studentId))&&courseMap.has(String(p.classId))&&
    db.students.some(s=>String(s.id)===String(p.studentId)&&String(s.classId)===courseMap.get(String(p.classId)))&&[1,-1].includes(Number(p.val)));
  db.attendance=db.attendance.filter(a=>courseMap.has(String(a.classId))&&isObject(a.marks));
  db.attendance.forEach(a=>{
    const cl=courseMap.get(String(a.classId));
    Object.keys(a.marks).forEach(sid=>{
      const st=db.students.find(s=>String(s.id)===String(sid));
      if(!st||String(st.classId)!==cl||!['a','l','e'].includes(a.marks[sid]))delete a.marks[sid];
    });
  });
  db.exams=db.exams.filter(e=>courseMap.has(String(e.classId))&&isObject(e.scores)&&Number.isFinite(Number(e.max))&&Number(e.max)>0);
  db.exams.forEach(e=>{
    const cl=courseMap.get(String(e.classId));
    Object.keys(e.scores).forEach(sid=>{
      const st=db.students.find(s=>String(s.id)===String(sid)),n=Number(e.scores[sid]);
      if(!st||String(st.classId)!==cl||!Number.isFinite(n)||n<0||n>Number(e.max))delete e.scores[sid];
    });
  });
  Object.keys(db.schedule).forEach(k=>{if(!courseMap.has(String(db.schedule[k])))delete db.schedule[k];});
  db.assessmentPeriods=(db.assessmentPeriods||[]).filter(p=>courseMap.has(String(p.courseId))&&Array.isArray(p.methods)&&isObject(p.records||{}));
  db.assessmentPeriods.forEach(p=>{const cl=courseMap.get(String(p.courseId));Object.keys(p.records||{}).forEach(sid=>{const st=db.students.find(x=>String(x.id)===String(sid));if(!st||String(st.classId)!==cl)delete p.records[sid];});});
  db.assignments=(db.assignments||[]).filter(a=>courseMap.has(String(a.courseId))&&a.records&&isObject(a.records));
  db.assignments.forEach(a=>{if(!isObject(a.records))a.records={};const cl=courseMap.get(String(a.courseId));Object.keys(a.records).forEach(sid=>{const st=db.students.find(x=>String(x.id)===String(sid));if(!st||String(st.classId)!==cl)delete a.records[sid];});});
  if(!Array.isArray(db.settings.hidden))db.settings.hidden=[5,6];
}

function sheet(title,fields,vals,onOk,hint){
  pushModalHistory();
  $('modal').innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><h2>${title}</h2>`+
    '<div class="sheet-fields">'+fields.map(f=>`<label for="f_${f.k}">${f.label}</label>`+(f.area?
      `<textarea id="f_${f.k}" placeholder="${f.ph||''}">${esc(vals[f.k]||'')}</textarea>`:
      f.type==='select'?`<select id=\"f_${f.k}\">${f.options.map(o=>`<option value=\"${o[0]}\" ${String(vals[f.k]||'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:
      f.type==='jdate'?`<div class="jdate-wrap"><input id="f_${f.k}" data-jdate inputmode="numeric" value="${esc(vals[f.k]||jalaliInput(today()))}" placeholder="${f.ph||'۱۴۰۵/۰۸/۰۸'}"><input type="date" class="jdate-picker" aria-label="انتخاب تاریخ از تقویم" value="${esc(parseJalali(vals[f.k]||'')||today())}" data-for="f_${f.k}"></div>`:
      `<input id="f_${f.k}" value="${esc(vals[f.k]||'')}" placeholder="${f.ph||''}">`)).join('')+
    (hint?`<p class="hint">${hint}</p>`:'')+'</div>'+
    '<div class="actions"><button class="btn no" id="no">انصراف</button><button class="btn ok" id="ok">ذخیره</button></div></div></div>';
  const first=$('modal').querySelector('input,textarea');if(first)first.focus();
  $('modal').querySelectorAll('input,textarea').forEach(el=>el.addEventListener('focus',()=>setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),180)));
  $('modal').querySelectorAll('.jdate-picker').forEach(el=>el.addEventListener('change',()=>{const target=$(el.dataset.for);if(target&&el.value)target.value=jalaliInput(el.value);}));
  $('no').onclick=closeSheet;
  $('modal').querySelector('.sheet-bg').onclick=e=>{if(e.target.classList.contains('sheet-bg'))closeSheet();};
  $('modal').querySelectorAll('input').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();}}));
  $('ok').onclick=()=>{
    const out={};fields.forEach(f=>out[f.k]=$('f_'+f.k).value.trim());
    const before=clone(db);
    if(onOk(out)!==false){
      if(save()){closeSheet();render();}
      else{db=before;render();}
    }
  };
}

function remove(kind,id){
  const messages={s:'این مدرسه با همه کلاس‌ها و دانش‌آموزانش حذف شود؟',c:'این کلاس با همه دانش‌آموزانش حذف شود؟',t:'این دانش‌آموز حذف شود؟',o:'این درس با حضور و غیاب، آزمون‌ها و نمره‌هایش حذف شود؟',x:'این آزمون حذف شود؟'};
  if(!messages[kind]||!confirm(messages[kind]))return;
  commitMutation(()=>{
    if(kind==='s'){
      const classIds=new Set(db.classes.filter(c=>String(c.schoolId)===String(id)).map(c=>String(c.id)));
      db.students=db.students.filter(t=>!classIds.has(String(t.classId)));
      db.classes=db.classes.filter(c=>String(c.schoolId)!==String(id));
      db.schools=db.schools.filter(s=>String(s.id)!==String(id));
    }else if(kind==='c'){
      db.students=db.students.filter(t=>String(t.classId)!==String(id));
      db.classes=db.classes.filter(c=>String(c.id)!==String(id));
    }else if(kind==='t')db.students=db.students.filter(t=>String(t.id)!==String(id));
    else if(kind==='o')db.courses=db.courses.filter(o=>String(o.id)!==String(id));
    else if(kind==='x')db.exams=db.exams.filter(x=>String(x.id)!==String(id));
    clean();
  });
  render();
}

function createAttendanceSession(courseId,date){
  const co=db.courses.find(x=>String(x.id)===String(courseId));
  if(!co)return null;
  const g=db.classes.find(x=>String(x.id)===String(co.classId));
  if(!g)return null;
  let r=db.attendance.find(a=>String(a.classId)===String(courseId)&&a.date===date);
  if(!r){
    r={id:uid(),classId:courseId,date,marks:{}};
    db.attendance.push(r);
  }
  if(!isObject(r.marks))r.marks={};
  return r;
}
function attHtml(co,list){
  const d=v.date||today();
  const r=db.attendance.find(a=>String(a.classId)===String(co.id)&&a.date===d);
  const marks=r&&isObject(r.marks)?r.marks:{};
  const absent=Object.values(marks).filter(x=>x==='a').length;
  const late=Object.values(marks).filter(x=>x==='l').length;
  const excused=Object.values(marks).filter(x=>x==='e').length;
  const sessionButton=r?
    '<button class="chip" disabled>✓ جلسه ثبت شده</button>':
    '<button class="chip" data-act="session">ثبت جلسه (همه حاضر)</button>';
  return `<div class="bar">${dateField('adate',d)}</div>
    <div class="bar session">${sessionButton}</div>
    <p class="hint" style="margin:0 2px 10px">${fdate(d)} • وضعیت پیش‌فرض همه حاضر است؛ فقط غایب، تأخیر یا موجه را مشخص کن.</p>
    <p class="hint" style="margin:0 2px 10px">غایب: ${fa(absent)} • تأخیر: ${fa(late)} • موجه: ${fa(excused)}</p>
    <div class="group">`+list.map(t=>{
      const status=marks[t.id];
      return `<div class="row" style="cursor:default"><div class="info">${studentButton(t)}<span>${status?ST[status]:'حاضر'}</span></div><div class="seg">`+
        Object.entries(ST).map(([k,n])=>`<button class="sg s-${k}${status===k?' on':''}" data-act="mark" data-id="${esc(t.id)}" data-s="${k}">${n}</button>`).join('')+
        '</div></div>';
    }).join('')+'</div>';
}
function mark(studentId,status){
  const co=db.courses.find(x=>String(x.id)===String(v.courseId));
  const g=co&&db.classes.find(x=>String(x.id)===String(co.classId));
  const st=db.students.find(x=>String(x.id)===String(studentId));
  if(!co||!g||!st||String(st.classId)!==String(g.id)||!Object.prototype.hasOwnProperty.call(ST,status)){
    alert('این دانش‌آموز یا وضعیت حضور و غیاب معتبر نیست.');return;
  }
  const before=clone(db);
  const r=createAttendanceSession(co.id,v.date||today());
  if(!r)return;
  if(r.marks[studentId]===status)delete r.marks[studentId];
  else r.marks[studentId]=status;
  if(save())render();else db=before;
}
function registerSession(){
  const co=db.courses.find(x=>String(x.id)===String(v.courseId));

  commitMutation(()=>{createAttendanceSession(co.id,date);});
  render();
}

function addAssignment(id){
 const old=(db.assignments||[]).find(a=>String(a.id)===String(id))||{};
 sheet(id?'ویرایش تکلیف':'تکلیف جدید',[
  {k:'title',label:'عنوان تکلیف',ph:'مثلاً طراحی مدار روشنایی'},
  {k:'description',label:'توضیحات',area:true,ph:'شرح کار و معیارهای ارزیابی'},
  {k:'dueDate',label:'تاریخ تحویل (شمسی)',ph:'۱۴۰۵/۰۸/۱۵',type:'jdate'},
  {k:'maxScore',label:'نمره کل',ph:'۲۰'}
 ],{title:old.title||'',description:old.description||'',dueDate:old.dueDate?jalaliInput(old.dueDate):jalaliInput(today()),maxScore:old.maxScore??20},d=>{
  if(!d.title.trim())return needName({name:d.title});
  const due=parseJalali(d.dueDate),max=Number(fixNum(d.maxScore));
  if(!due){alert('تاریخ شمسی معتبر وارد کن.');return false;}

function validScores(ex){
  if(!ex||!isObject(ex.scores))return [];
  return Object.values(ex.scores).map(Number).filter(n=>Number.isFinite(n)&&n>=0&&n<=Number(ex.max));
}
function avgOf(ex){
  const scores=validScores(ex);
  return scores.length?fa((scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1)):'—';
}
function assessmentPeriodsFor(courseId){return (db.assessmentPeriods||[]).filter(p=>String(p.courseId)===String(courseId));}
function weightedAssessment(period,studentId){
 const rec=(period.records||{})[studentId]||{},methods=period.methods||[];let total=0,weight=0;
 methods.forEach(m=>{const raw=rec[m.id];if(raw===undefined||raw===null||raw==='')return;const score=Number(raw),max=Number(m.maxScore)||20,w=Number(m.weight)||0;if(Number.isFinite(score)&&max>0&&score>=0&&score<=max&&w>0){total+=(score/max)*100*w;weight+=w;}});
 return weight?total/weight:null;
}
function assessmentWeightCoverage(period,studentId){const rec=(period.records||{})[studentId]||{};return (period.methods||[]).reduce((sum,m)=>rec[m.id]===undefined||rec[m.id]===null||rec[m.id]===''?sum:sum+Number(m.weight||0),0);}

  {k:'title',label:'عنوان دوره / نوبت',ph:'مثلاً ارزشیابی مستمر نیمسال اول'},

 ],{title:old.title||'',methods},d=>{
  if(!d.title.trim())return needName({name:d.title});

  for(const line of lines){const parts=line.split('|').map(x=>x.trim()),title=parts[0],weight=Number(fixNum(parts[1])),maxScore=Number(fixNum(parts[2]||'20'));if(!title||!Number.isFinite(weight)||weight<=0||weight>100||!Number.isFinite(maxScore)||maxScore<=0){alert('هر روش را به شکل «نام روش | وزن | نمره کل» وارد کن.');return false;}parsed.push({id:uid(),title,weight,maxScore});}

  if(id){const prior=old.methods||[];parsed.forEach((m,i)=>{const match=prior.find(x=>String(x.title).trim()===String(m.title).trim())||prior[i];if(match)m.id=match.id;});const keep=new Set(parsed.map(m=>String(m.id)));for(const rec of Object.values(old.records||{})){for(const mid of Object.keys(rec))if(!keep.has(String(mid)))delete rec[mid];}for(const rec of Object.values(old.records||{})){for(const m of parsed){const score=rec[m.id];if(score!=null&&Number(score)>Number(m.maxScore)){alert('نمره‌های ثبت‌شده برای روش «'+m.title+'» از نمره کل جدید بیشترند. ابتدا نمره‌ها را اصلاح کن.');return false;}}}old.title=d.title;old.methods=parsed;}
  else db.assessmentPeriods.push({id:uid(),courseId:v.courseId,title:d.title,methods:parsed,records:{},createdAt:today()});
 });
}

  const sid=t.dataset.sid,old=ex.scores[sid],raw=fixNum(t.value);
  if(raw===''){
    if(old!==undefined){
      const before=clone(db);delete ex.scores[sid];
      if(save())return;
      db=before;t.value=old;
    }
    return;
  }
  const n=Number(raw);
  if(!Number.isFinite(n)||n<0||n>Number(ex.max)){
    alert('نمره باید عددی بین صفر و '+fa(ex.max)+' باشد.');
    t.value=old??'';return;

}

  const d=empty();
  for(const k of ARRAY_KEYS){
    if(source[k]!==undefined&&!Array.isArray(source[k]))throw new Error('ساختار بخش '+k+' معتبر نیست.');
    if(Array.isArray(source[k]))d[k]=source[k];
  }
  if(source.schedule!==undefined&&!isObject(source.schedule))throw new Error('برنامه هفتگی معتبر نیست.');
  if(isObject(source.schedule))d.schedule=source.schedule;
  if(source.settings!==undefined&&!isObject(source.settings))throw new Error('تنظیمات معتبر نیست.');
  if(isObject(source.settings))d.settings=Object.assign(d.settings,source.settings);
  if(!Array.isArray(d.settings.hidden))d.settings.hidden=[5,6];
  d.settings.hidden=d.settings.hidden.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6);
  d.settings.teacher=String(d.settings.teacher||'');
  d.settings.school=String(d.settings.school||'');
  d.settings.transpose=!!d.settings.transpose;
  d.v2=source.v2||0;d.v3=source.v3||0;
  const result=validateData(d,{allowLegacy:!d.v2});
  if(!result.ok)throw new Error(result.message);
  return d;
}
function restore(file){
  if(!file)return;
  if(file.size>MAX_BACKUP_BYTES){alert('حجم فایل پشتیبان بیشتر از ۲۰ مگابایت است.');return;}
  const reader=new FileReader();
  reader.onerror=()=>alert('خواندن فایل پشتیبان ممکن نشد.');
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(String(reader.result||''));
      const candidate=candidateFromBackup(parsed);
      const counts='مدرسه: '+fa(candidate.schools.length)+'\nکلاس: '+fa(candidate.classes.length)+
        '\nدانش‌آموز: '+fa(candidate.students.length)+'\nدرس: '+fa(candidate.courses.length)+
        '\nجلسه حضور و غیاب: '+fa(candidate.attendance.length)+'\nآزمون: '+fa(candidate.exams.length)+'\nدوره ارزشیابی ترکیبی: '+fa((candidate.assessmentPeriods||[]).length);
      if(!confirm('اطلاعات فعلی با اطلاعات این فایل جایگزین شود؟\n\n'+counts+'\n\nپیشنهاد: قبل از بازیابی، از اطلاعات فعلی پشتیبان بگیر.'))return;
      const previous=db;
      const previousWarning=loadWarning;
      db=candidate;
      loadWarning='';
      migrate(false);
      clean();
      if(!save()){db=previous;loadWarning=previousWarning;render();return;}
      v={page:'schools'};render();
      alert('بازیابی با موفقیت انجام شد.');
    }catch(e){
      alert('بازیابی انجام نشد؛ اطلاعات فعلی دست‌نخورده باقی ماند.\n'+(e.message||'فایل پشتیبان معتبر نیست.'));
    }
  };
  reader.readAsText(file);
}

function stat(co,t){
  const att=db.attendance.filter(a=>String(a.classId)===String(co.id)),m={a:0,l:0,e:0};
  att.forEach(a=>{const x=a.marks&&a.marks[t.id];if(x&&m[x]!==undefined)m[x]++;});
  return{
    m,sessions:att.length,
    pts:db.points.filter(p=>String(p.studentId)===String(t.id)&&String(p.classId)===String(co.id)),
    ex:db.exams.filter(e=>String(e.classId)===String(co.id)).map(e=>({title:e.title,max:e.max,score:e.scores&&e.scores[t.id]})).concat((db.assessmentPeriods||[]).filter(p=>String(p.courseId)===String(co.id)).map(p=>({title:p.title,max:100,score:weightedAssessment(p,t.id)})))
  };
}

function scorePercent(co,t){
  const xs=db.exams.filter(e=>String(e.classId)===String(co.id)&&e.scores&&e.scores[t.id]!=null&&Number(e.max)>0).map(e=>Number(e.scores[t.id])/Number(e.max)*100);
  (db.assessmentPeriods||[]).filter(p=>String(p.courseId)===String(co.id)).forEach(p=>{const score=weightedAssessment(p,t.id);if(score!==null)xs.push(score);});
  return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
}
function attendanceSummary(co,list){
  const sessions=db.attendance.filter(a=>String(a.classId)===String(co.id));
  const out={present:0,absent:0,late:0,excused:0,sessions:sessions.length};
  sessions.forEach(a=>list.forEach(t=>{
    const m=a.marks&&a.marks[t.id];
    if(m==='a')out.absent++;else if(m==='l')out.late++;else if(m==='e')out.excused++;else out.present++;
  }));
  return out;
}
function assignmentSummary(co,list){
  const out={submitted:0,incomplete:0,missing:0,unrecorded:0,total:0};
  (db.assignments||[]).filter(a=>String(a.courseId)===String(co.id)).forEach(a=>list.forEach(t=>{
    out.total++;const r=a.records&&a.records[t.id]||{};
    if(r.status==='submitted')out.submitted++;
    else if(r.status==='incomplete')out.incomplete++;
    else if(r.status==='missing')out.missing++;
    else out.unrecorded++;
  }));
  return out;
}

/* IndexedDB local mirror: localStorage remains the compatibility source until verified migration.
   This preserves offline use and ensures older builds can still read the canonical snapshot. */
const IDB_NAME='DaftarLocalDB',IDB_STORE='snapshots',IDB_KEY='main-v5';
function openDaftarDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window))return reject(new Error('IndexedDB پشتیبانی نمی‌شود.'));
  const req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(IDB_STORE))d.createObjectStore(IDB_STORE);};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('خطا در بازکردن IndexedDB'));
 });
}
async function persistIndexedDBSnapshot(){
 try{const idb=await openDaftarDB();await new Promise((resolve,reject)=>{const tx=idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put({savedAt:new Date().toISOString(),data:db},IDB_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});idb.close();}
 catch(e){/* localStorage remains authoritative; do not block normal operation */}
}
async function restoreIndexedDBIfLocalEmpty(){
 try{
  if(localStorage.getItem(KEY)!==null)return false;
  const idb=await openDaftarDB();
  const snap=await new Promise((resolve,reject)=>{const tx=idb.transaction(IDB_STORE,'readonly'),r=tx.objectStore(IDB_STORE).get(IDB_KEY);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});
  idb.close();
  if(!snap)return false;
  if(!isObject(snap.data)){loadWarning='نسخه پشتیبان داخلی مرورگر پیدا شد، اما ساختار آن قابل خواندن نیست. برای جلوگیری از بازنویسی اطلاعات، برنامه در حالت محافظت‌شده باز می‌شود.';return false;}
  const candidate=empty();
  ARRAY_KEYS.forEach(k=>{if(Array.isArray(snap.data[k]))candidate[k]=snap.data[k];});
  if(isObject(snap.data.schedule))candidate.schedule=snap.data.schedule;
  if(isObject(snap.data.settings))candidate.settings=Object.assign(candidate.settings,snap.data.settings);
  candidate.v2=snap.data.v2||1;candidate.v3=snap.data.v3||1;
  const check=validateData(candidate,{allowLegacy:false});if(!check.ok){loadWarning='نسخه پشتیبان داخلی مرورگر با ساختار فعلی سازگار نیست. هیچ داده‌ای بازنویسی نشده است. جزئیات: '+check.message;return false;}
  db=candidate;try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){loadWarning='اطلاعات از نسخه پشتیبان داخلی خوانده شد، اما ذخیره آن در حافظه محلی ممکن نشد. فضای مرورگر را بررسی کن؛ نسخه داخلی بازنویسی نمی‌شود.';return false;}return true;
 }catch(e){return false;}
}

  if(act==='share')return share();
  if(act==='day'){
    const before=clone(db),i=Number(el.dataset.i),h=db.settings.hidden;
    if(h.includes(i))db.settings.hidden=h.filter(x=>x!==i);
    else if(h.length<6)h.push(i);
    if(!save())db=before;return render();
  }
  if(act==='prof'){
    const st=db.settings;
    return sheet('مشخصات سربرگ گزارش',[{k:'teacher',label:'نام معلم'},{k:'school',label:'نام مدرسه (اختیاری)'}],st,d=>{
      st.teacher=d.teacher;st.school=d.school;
    });
  }
  if(act==='tab'){v.tab=el.dataset.t;v.examId=null;v.periodId=null;v.assignmentId=null;return render();}
  if(act==='mark')return mark(id,el.dataset.s);
  if(act==='pm')return givePoint(id,Number(el.dataset.v));
  if(act==='backup')return backup();
  if(act==='restore')return $('rf').click();
  if(act==='edit'){e.stopPropagation();return addOrEdit(k,id);}
  if(act==='del'){e.stopPropagation();return remove(k,id);}
  if(act==='open'){
    if(k==='s')v={page:'classes',nav:'schools',schoolId:id};
    else if(k==='c')v={page:'students',nav:'schools',schoolId:v.schoolId,classId:id};
    else if(k==='t'){v.profileId=id;return render();}
    else if(k==='x'){v.examId=id;render();window.scrollTo(0,0);return;}
    else if(k==='o')return openCourse(id);
    render();window.scrollTo(0,0);
  }
});
$('fab').onclick=()=>{
 if(v.page==='students'&&v.courseId&&v.tab==='hw')return addAssignment();
 if(v.page==='students'&&v.courseId&&v.tab==='exam')return assessmentPeriodForm();
 return addOrEdit(v.page==='students'?(v.courseId?'x':v.tab==='courses'?'o':'t'):{schools:'s',classes:'c'}[v.page]);
};
$('back').onclick=()=>{
  if($('modal').innerHTML){closeSheet();return;}
  if(history.state&&history.state.daftarRoute){history.back();return;}
  if(v.profileId){v.profileId=null;render();return;}
  if(v.tool||v.periodId||v.assignmentId||v.examId){v.tool=null;v.periodId=null;v.assignmentId=null;v.examId=null;render();return;}
  if(v.courseId){v=v.from==='plan'?{nav:'plan'}:{page:'students',nav:'schools',schoolId:v.schoolId,classId:v.classId,tab:'courses'};render();return;}
  v=v.page==='students'?{page:'classes',nav:'schools',schoolId:v.schoolId}:{page:'schools',nav:'schools'};render();
};
$('app').addEventListener('input',e=>{if(e.target.id==='directoryQuery'){const pos=e.target.selectionStart;v.directoryQuery=e.target.value;renderStudentDirectory();const next=$('directoryQuery');if(next){next.focus();next.setSelectionRange(pos,pos);}}});
$('app').addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('jdate-picker')){const target=$(t.dataset.for);if(target&&t.value){target.value=jalaliInput(t.value);if(t.dataset.for==='adate'){v.date=t.value;render();}}return;}
  if(t.id==='adate'){const parsed=parseJalali(t.value);if(!parsed){alert('تاریخ شمسی را به شکل ۱۴۰۵/۰۸/۰۸ وارد کن.');t.value=jalaliInput(v.date||today());return;}v.date=parsed;render();return;}
  if(t.id==='rf'&&t.files&&t.files[0]){restore(t.files[0]);t.value='';return;}
  if(t.matches('[data-shortcut-select]')){const i=Number(t.dataset.shortcutSelect),next=shortcutList().slice();next[i]=t.value;db.settings.shortcuts=next;if(save())render();return;}
  if(t.classList.contains('period-score')){assessmentScoreChange(t);return;}
  if(t.matches('[data-evaluation-score]')){const ev=db.evaluations.find(x=>String(x.id)===String(t.dataset.evaluation));if(!ev)return;const sid=t.dataset.student,cid=t.dataset.criterion;if(!isObject(ev.results))ev.results={};if(!isObject(ev.results[sid]))ev.results[sid]={};if(t.value==='')delete ev.results[sid][cid];else ev.results[sid][cid]=Number(t.value);save();return;}
  if(t.id==='globalQuery'&&e.type==='change'){$('searchResults').innerHTML=globalSearch(t.value);return;}
  if(t.classList.contains('sc')){scoreChange(t);return;}
});

async function bootstrap(){
  // Keep the loading surface visible until the local mirror has been checked.
  if(!loadWarning)await restoreIndexedDBIfLocalEmpty();
  if(!loadWarning){
    ['checklists','evaluations','groups','teachingLogs','assessmentPeriods'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[];});
    migrate(true);
    clean();
    if(!Array.isArray(db.settings.shortcuts))db.settings.shortcuts=shortcutDefaults();
  }
  $('boot')?.remove();
  render();
  if(!loadWarning)persistIndexedDBSnapshot();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
bootstrap();

window.addEventListener('popstate',e=>{
  if(modalHistoryOpen){modalHistoryOpen=false;$('modal').innerHTML='';$('modal').onclick=null;}
  if(e.state&&e.state.daftarRoute){v=clone(e.state.daftarRoute);suppressRouteHistory=true;lastRouteKey=routeKey();render();return;}
  const now=Date.now();
  if(now-lastRootBack<1800)return;
  lastRootBack=now;
  history.pushState({daftarRoute:clone(v)},'');lastRouteKey=routeKey();
  alert('برای خروج از دفتر، یک‌بار دیگر دکمه بازگشت را بزن.');
});
</script>
